people:
  # ===== Current members =====
  - name: Osezua Ibhadode
    credentials: PhD, PEng
    group: pi
    role: Assistant Professor, Mechanical Engineering
    photo: ibhadode.jpg
    email: mdamlab@ualberta.ca
    linkedin: https://www.linkedin.com/in/osezua-ibhadode-89663030/
    scholar: https://scholar.google.com/citations?user=sgSQSDgAAAAJ&hl=en
    # TODO: expand this bio (education, previous positions, awards)
    bio: |
      Dr. Osezua Ibhadode is an Assistant Professor in the Department of
      Mechanical Engineering at the University of Alberta and a registered
      Professional Engineer. His research sits where computational design meets
      additive manufacturing: topology optimization, lattice and porous
      structures, process-aware design and AI-assisted design.

      He is a co-author of the textbook *Metal Additive Manufacturing*
      (Wiley, 2021), a co-inventor on two patent applications on topology
      optimization for additive manufacturing, and the developer of several
      open-source design tools. He teaches finite element methods,
      manufacturing processes, and design for additive manufacturing.

